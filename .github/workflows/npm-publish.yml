# npm 发布工作流：手动触发或推送 v* tag 时，经 OIDC（trusted publishing）发布到 npm registry
name: npm publish

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # OIDC 认证（npm trusted publishing），换取短时发布凭证
      contents: read
    steps:
      - uses: actions/checkout@v6

      # 安装 bun（依赖管理、测试与类型检查均使用 bun）
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # 配置 npm registry
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # trusted publishing 要求 npm CLI >= 11.5.1（Node 22 捆绑的 npm 为 10.x）
      - run: npm install -g npm@latest
      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: bun run typecheck

      # 版本号由 package.json 决定，发布前手动升级版本并打 v* tag
      - run: npm publish